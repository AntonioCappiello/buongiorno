name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the marketplace version
        run: |
          v=$(python3 -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }

      - name: Build the .skill package
        run: ./scripts/build.sh

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} /^\[[0-9.]+\]: / {next} on' CHANGELOG.md > notes.md
          sum=$(sha256sum dist/buongiorno.skill | cut -d' ' -f1)
          printf '\n### Checksum\n\n```\n%s  buongiorno.skill\n```\n' "$sum" >> notes.md
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/buongiorno.skill --title "$GITHUB_REF_NAME" --notes-file notes.md
