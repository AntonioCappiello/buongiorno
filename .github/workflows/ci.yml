name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Feed checker compiles and shows its help
        run: |
          python -m py_compile skills/buongiorno/scripts/check_feeds.py
          python skills/buongiorno/scripts/check_feeds.py | grep -q "Usage"

      - name: SKILL.md has a name and description
        run: |
          python - <<'PY'
          import re, sys
          text = open("skills/buongiorno/SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md: missing frontmatter")
          fm = m.group(1)
          for key in ("name", "description"):
              if not re.search(rf"^{key}:\s*\S", fm, re.M):
                  sys.exit(f"SKILL.md: frontmatter has no {key}")
          print("frontmatter OK")
          PY

      - name: Marketplace manifest is valid JSON with matching versions
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open(".claude-plugin/marketplace.json"))
          versions = {m["metadata"]["version"], *(p["version"] for p in m["plugins"])}
          if len(versions) != 1:
              sys.exit(f"version mismatch: {versions}")
          print("marketplace OK", versions.pop())
          PY

      - name: No secrets committed
        run: |
          if grep -rEn --exclude-dir=.git \
               -e 'SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}' \
               -e 'sk-ant-[A-Za-z0-9_-]{20,}' \
               -e 'gh[pousr]_[A-Za-z0-9]{30,}' \
               -e 'github_pat_[A-Za-z0-9_]{30,}' \
               -e 'ATCTT3[A-Za-z0-9_=-]{20,}' \
               -e 'xox[abp]-[A-Za-z0-9-]{10,}' \
               -e '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' . ; then
            echo "Possible secret found"; exit 1
          fi

      - name: Build the .skill package
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buongiorno.skill
          path: dist/buongiorno.skill
